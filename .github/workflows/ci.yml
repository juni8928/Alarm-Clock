name: Alarm Clock CI

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t alarm_clock_frontend:latest ./frontend

      - name: Build backend image
        run: docker build -t alarm_clock_backend:latest ./backend