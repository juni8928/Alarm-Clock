name: Alarm Clock CI

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/alarm-clock-frontend:latest ./frontend

      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/alarm-clock-backend:latest ./backend

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/alarm-clock-frontend:latest

      - name: Push backend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/alarm-clock-backend:latest